[project]
name = "newsmaker"
version = "0.1.0"
description = "Generate an article about the currently trending angle on a topic."
readme = "README.md"
authors = [
    { name = "konsgrib", email = "12676818+konsgrib@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "openai>=3.10.0",
    "trafilatura>=2.2.0",
]

[project.scripts]
newsmaker = "newsmaker.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
